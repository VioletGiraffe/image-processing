name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: Build and test on ${{ matrix.os }}${{ matrix.compiler == 'clang' && ' (Clang)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        # The axis must exist for the include to add a job: an include that only adds a new key extends the matching job instead
        compiler: [default]
        include:
          - os: ubuntu-latest
            compiler: clang
          - os: ubuntu-24.04-arm
            compiler: clang
          - os: windows-latest
            compiler: clang

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.10.*
        target: desktop
        archives: 'qtbase icu'

    - name: Set up MSVC environment
      if: startsWith(matrix.os, 'windows')
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Checkout dependencies
      run: |
        git clone --depth 1 https://github.com/VioletGiraffe/cpp-template-utils ../cpp-template-utils
        git clone --depth 1 https://github.com/VioletGiraffe/cpputils ../cpputils
        # Only for the tests' header-only Catch2 printers, qtcore_helpers/catch_qt.hpp
        git clone --depth 1 https://github.com/VioletGiraffe/qtutils ../qtutils

    # cmd's exit status is the last command's, so every command fails the step itself
    - name: Build tests on Windows
      if: startsWith(matrix.os, 'windows') && matrix.compiler != 'clang'
      shell: cmd
      working-directory: tests
      run: |
        %QT_ROOT_DIR%\bin\qmake.exe -v
        %QT_ROOT_DIR%\bin\qmake.exe -tp vc image-processing-tests.pro || exit /b 1
        msbuild image-processing-tests.vcxproj /t:Build /p:Configuration=Release || exit /b 1

    # The image's standalone LLVM goes first on PATH: the spec calls clang-cl, lld-link and llvm-lib by name
    - name: Build tests on Windows with clang-cl
      if: startsWith(matrix.os, 'windows') && matrix.compiler == 'clang'
      shell: cmd
      working-directory: tests
      run: |
        set "PATH=C:\Program Files\LLVM\bin;%PATH%"
        clang-cl --version || exit /b 1
        %QT_ROOT_DIR%\bin\qmake.exe image-processing-tests.pro -spec win32-clang-msvc -config release CONFIG+=release CONFIG-=debug_and_release || exit /b 1
        nmake || exit /b 1

    - name: Build tests on macOS
      if: startsWith(matrix.os, 'macos')
      working-directory: tests
      run: |
        clang --version
        $QT_ROOT_DIR/bin/qmake image-processing-tests.pro -config release CONFIG+=release
        make -j$(sysctl -n hw.ncpu)

    - name: Build tests on Linux
      if: startsWith(matrix.os, 'ubuntu') && matrix.compiler != 'clang'
      working-directory: tests
      run: |
        sudo apt update -y
        sudo apt install -qq gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 50
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 50
        g++ --version
        $QT_ROOT_DIR/bin/qmake image-processing-tests.pro -config release CONFIG+=release
        make -j$(nproc)

    # lld links Clang's thin LTO objects without a linker plugin
    - name: Build tests on Linux with Clang
      if: startsWith(matrix.os, 'ubuntu') && matrix.compiler == 'clang'
      working-directory: tests
      run: |
        sudo apt update -y
        sudo apt install -qq clang lld
        clang++ --version
        $QT_ROOT_DIR/bin/qmake image-processing-tests.pro -spec linux-clang -config release CONFIG+=release QMAKE_LFLAGS+=-fuse-ld=lld
        make -j$(nproc)

    - name: Run tests on Windows
      if: startsWith(matrix.os, 'windows')
      run: ./tests/bin/release/image-processing-tests.exe

    - name: Run tests on macOS
      if: startsWith(matrix.os, 'macos')
      run: ./tests/bin/release/image-processing-tests.app/Contents/MacOS/image-processing-tests

    - name: Run tests on Linux
      if: startsWith(matrix.os, 'ubuntu')
      run: ./tests/bin/release/image-processing-tests

    # Runners of one label vary in CPU model, and the benchmark ratios with it
    - name: Show the CPU
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux) lscpu ;;
          # Filtered, not queried by name: Apple Silicon lacks some of these keys, and an unknown one fails sysctl
          macOS) sysctl -a | grep -E '^(machdep\.cpu\.brand_string|hw\.(physicalcpu|logicalcpu|l2cachesize|l3cachesize|perflevel[0-9]\.(name|physicalcpu|l2cachesize))):' ;;
          Windows) pwsh -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors, L2CacheSize, L3CacheSize" ;;
        esac

    - name: Run benchmarks on Windows
      if: startsWith(matrix.os, 'windows')
      env:
        QT_NO_GUI_THREADPOOL: 1
      run: |
        ./tests/bin/release/image-processing-tests.exe "[!benchmark]" --benchmark-samples 10 --benchmark-no-analysis --reporter xml --out benchmark-results.xml
        python ./tests/report_benchmark_ratios.py benchmark-results.xml

    - name: Run benchmarks on macOS
      if: startsWith(matrix.os, 'macos')
      env:
        QT_NO_GUI_THREADPOOL: 1
      run: |
        ./tests/bin/release/image-processing-tests.app/Contents/MacOS/image-processing-tests "[!benchmark]" --benchmark-samples 10 --benchmark-no-analysis --reporter xml --out benchmark-results.xml
        python ./tests/report_benchmark_ratios.py benchmark-results.xml

    - name: Run benchmarks on Linux
      if: startsWith(matrix.os, 'ubuntu')
      env:
        QT_NO_GUI_THREADPOOL: 1
      run: |
        ./tests/bin/release/image-processing-tests "[!benchmark]" --benchmark-samples 10 --benchmark-no-analysis --reporter xml --out benchmark-results.xml
        python ./tests/report_benchmark_ratios.py benchmark-results.xml
